# 1. Configurações de Conexão com o H2
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA/Hibernate: Deixa o Hibernate criar as tabelas sozinho no H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Desabilita a execução do schema.sql nos testes (evita erro de path/sintaxe)
spring.sql.init.mode=never