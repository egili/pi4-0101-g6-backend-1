# 1. Configurações de Conexão com o H2
# Um banco por contexto de teste. O Hibernate recria só a tabela usuario;
# se todos os contextos compartilham o mesmo H2, a credencial antiga reaparece com o id novo.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA/Hibernate: Deixa o Hibernate criar as tabelas sozinho no H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Cria as tabelas de database/schema.sql (a tabela credencial é usada via JdbcTemplate)
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/schema.sql

# 4. Chave JWT de teste (este arquivo substitui o application.properties principal nos testes)
jwt.secret=chave-de-teste-do-cofre-com-mais-de-32-caracteres
jwt.expiration=86400000