server.port=8080
spring.application.name=backend-1-servidor

# Conexão com o PostgreSQL (usando as variáveis do Docker Compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Configurações do JPA / Hibernate
# O 'update' faz o Spring criar ou atualizar as tabelas no banco automaticamente com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT (Token)
# A chave secreta precisa ter no mínimo 32 caracteres para o algoritmo HS256 funcionar
jwt.secret=chave-super-secreta-do-cofre-digital-pi4-grupo06-2026
# Tempo de expiração do token em milissegundos (86400000 ms = 24 horas)
jwt.expiration=86400000