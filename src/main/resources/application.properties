server.port=8080
spring.application.name=backend-1-servidor

# Conexão com o PostgreSQL (usando as variáveis do Docker Compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Configurações do JPA / Hibernate
# O 'update' faz o Spring criar ou atualizar as tabelas no banco automaticamente com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT (Token)
# A chave vem da variável de ambiente JWT_SECRET (nunca fixa no código), com no mínimo 32 caracteres
jwt.secret=${JWT_SECRET}
# Tempo de expiração do token em segundos (86400 s = 24 horas)
jwt.expiration=86400